load_module /usr/local/nginx/modules/libngx_http_pgxio_module.so;
worker_processes 1;
worker_shutdown_timeout 5s;
error_log stderr warn;
pid /tmp/nginx.pid;
env PGXIO_DATABASE_URL;
env PGXIO_DEV_SECRET;
events { worker_connections 4096; }
http {
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Leave room for chunk framing while retaining the 64 KiB decoded-body cap.
    client_body_buffer_size 128k;
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 5s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    include /etc/pgxio/pgxio.conf;
    server {
        listen 8080;
        server_name _;
        location / { pgxio; }
    }
}
