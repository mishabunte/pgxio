# Transport/event-loop overhead only: no JWT, SQL, or realtime work.
worker_processes 1;
events { worker_connections 4096; }
http {
    access_log off;
    server {
        listen 8080;
        listen 8443 ssl;
        ssl_protocols TLSv1.3;
        ssl_certificate /bench/tls-cert.pem;
        ssl_certificate_key /bench/tls-key.pem;
        location /baseline {
            default_type application/json;
            return 200 '{"ok":true}';
        }
    }
}
