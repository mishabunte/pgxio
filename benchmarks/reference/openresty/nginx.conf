worker_processes WORKERS_PLACEHOLDER;
pid /tmp/nginx.pid;
env DATABASE_URL;
env POOL_SIZE;
env MAX_WEBSOCKETS;
error_log stderr warn;
events { worker_connections CONNECTIONS_PLACEHOLDER; }
http {
    access_log off;
    lua_package_path '/app/?.lua;/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;;';
    lua_package_cpath '/usr/local/lib/lua/5.1/?.so;;';
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    lua_socket_log_errors off;
    init_worker_by_lua_block { require('app').start() }
    server {
        listen 8080;
        listen 8443 ssl;
        ssl_certificate /bench/tls-cert.pem;
        ssl_certificate_key /bench/tls-key.pem;
        ssl_protocols TLSv1.3;
        location / { content_by_lua_block { require('app').handle() } }
    }
}
