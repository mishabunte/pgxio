[package]
name = "pgxio-borrowed-synthetic"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[features]
diagnostics = []

[dependencies]
serde = { version = "1", features = ["derive"] }
jsonschema = { version = "0.29", default-features = false }
serde_json = "1"

[profile.release]
lto = false
debug = 1
