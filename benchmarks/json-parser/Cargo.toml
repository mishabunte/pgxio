[package]
name = "pgxio-json-parser-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
