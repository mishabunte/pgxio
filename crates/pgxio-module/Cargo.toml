[package]
name = "pgxio-module"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
build = "build.rs"

[features]
benchmark-auth = []
borrowed-libpq = []

[lib]
name = "ngx_http_pgxio_module"
crate-type = ["cdylib", "rlib"]

[dependencies]
ngx = { git = "https://github.com/nginx/ngx-rust", rev = "cf58b5270dc5e9b855dab765e9f13ba2a12c7709" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9.3"
jsonschema = { version = "0.29", default-features = false }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
pq-sys = "0.7"
libc = "0.2"
ring = "0.17"

[build-dependencies]
cc = "1"
