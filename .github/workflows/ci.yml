name: module-and-clients
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build matched Nginx/module and run Rust tests
        run: docker build -t pgxio:dev .
      - name: Start isolated example
        run: |
          bin/pgxio init
          docker compose up -d --no-build
      - name: Install test clients
        run: |
          python3 -m venv .venv
          .venv/bin/pip install './sdk/python[django]' 'httpx[http2]==0.28.1'
          npm ci --prefix sdk/typescript
      - name: Check generated types and clients
        run: |
          python3 scripts/generate.py examples/contract.json examples/generated
          git diff --exit-code -- examples/generated
          sdk/typescript/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json
      - name: HTTP and WebSocket regression suite
        run: .venv/bin/python tests/integration.py
      - name: TypeScript HTTP and subscriptions
        run: node --experimental-strip-types tests/typescript.ts
      - name: WSS, asymmetric JWT, and database TLS
        run: .venv/bin/python scripts/test-tls.py --production
      - name: Isolated pool, preparation, cancellation and JWT cache regressions
        run: .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite performance --production --profile cache
      - name: Sequential, unprepared and fail-fast compatibility
        run: |
          for profile in sequential unprepared failfast; do
            .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite performance --profile "$profile" --output "artifacts/perf-validation/$profile"
          done
      - name: REST input forwarding and optional schema checks
        run: |
          .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite input --production --output artifacts/input-validation/raw
          .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite input --production --input-validation schema --output artifacts/input-validation/schema
      - name: Native configuration and exact response bytes
        run: |
          .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite configuration --production --output artifacts/native-config/configuration
          .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite output --production --output artifacts/native-config/raw
          .venv/bin/python tests/run-isolated.py --image pgxio:dev --suite all --production --input-validation schema --output-validation schema --output artifacts/native-config/schema
      - name: Benchmark tooling regressions
        run: .venv/bin/python -m unittest discover -s benchmarks/tests -q
      - name: Runtime logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Stop example
        if: always()
        run: docker compose down
